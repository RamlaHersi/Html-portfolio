<!DOCTYPE html>
<html>

<head>
  <title>CSS Positioning Exercise</title>
  <style>
.blue-box {
  background-color: blue;
  width: 500px;
  height: 300px;
  margin-left: 200px;
  margin-top: 200px;
  position: relative;
}

.red-circle {
  width: 150px;
  height: 150px;
  background-color: red;
  border-radius: 50%;
  position: absolute;
  top: 190px;
  left: 300px;
}
    
  </style>
</head>

<body>
  <div class="blue-box">
    <div class="red-circle">
    </div>
  </div>

</body>

</html>
