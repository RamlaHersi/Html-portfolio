<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
  .flag{width:900px;
  height:600px;
background-color: rgb(221, 40, 40);}
div.flag>p{color: white;
font-size: 80px;
text-align: center;}
div div{width: 100%;
height: 250px;
background-color: rgb(0, 0, 148);
position: relative;}
div div div {width:150px;
height: 150px;
background-color: white;
border-radius: 50%;
position: absolute;
left: 300px;
top: 50px;}
div div div p{
font-size:60px;
text-align: center;
margin-top: 0%;
}

    
  </style>
</head>
<body>
  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of Laos</p>
      </div>
    </div>
  </div>
</body>

</html>
